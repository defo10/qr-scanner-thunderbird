<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1f2328; --muted: #59636e; --bg: #ffffff; --border: #d1d9e0; --danger: #cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6edf3; --muted: #9198a1; --bg: #1c2128; --border: #3d444d; --danger: #ff7b72; }
    }
    body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); margin: 16px; max-width: 640px; }
    h1 { font-size: 18px; margin: 0 0 16px; }
    fieldset { border: 1px solid var(--border); border-radius: 6px; margin: 16px 0; padding: 8px 12px 12px; }
    legend { font-weight: 600; padding: 0 4px; }
    .check { display: block; margin: 4px 0; }
    .hint { color: var(--muted); font-size: 12px; margin: 0 0 0 24px; }
    .limit { display: grid; grid-template-columns: 1fr 96px; gap: 2px 12px; align-items: center; margin: 8px 0; }
    .limit input { width: 96px; }
    .limit .message { grid-column: 1 / -1; }
    .message { color: var(--danger); font-size: 12px; margin: 0; }
    .message:empty { display: none; }
    input[aria-invalid="true"] { outline: 2px solid var(--danger); }
    .status { color: var(--muted); min-height: 1.5em; }
  </style>
</head>
<body>
  <main id="options"></main>
  <script type="module" src="options.js"></script>
</body>
</html>
